# /etc/apache2/sites-available/aurora.conf
# Reverse proxy de Apache -> Gunicorn (Django) + servido de estáticos.
# Módulos requeridos:  a2enmod proxy proxy_http headers
# Certbot añadirá automáticamente el bloque <VirtualHost *:443> con el SSL.

<VirtualHost *:80>
    ServerName sruedadev.com
    ServerAlias www.sruedadev.com

    # --- Archivos estáticos (los sirve Apache directamente, no Django) ---
    Alias /static/ /var/www/html/static/
    <Directory /var/www/html/static>
        Require all granted
    </Directory>

    # No pasar /static/ al proxy: lo atiende Apache.
    ProxyPass /static/ !

    # --- Todo lo demás va a Gunicorn ---
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass        / http://127.0.0.1:8001/
    ProxyPassReverse / http://127.0.0.1:8001/

    ErrorLog  ${APACHE_LOG_DIR}/aurora_error.log
    CustomLog ${APACHE_LOG_DIR}/aurora_access.log combined
</VirtualHost>

# NOTA: después de ejecutar Certbot, edita el bloque *:443 que él crea y
# cambia el header a HTTPS para que Django genere URLs seguras y valide CSRF:
#     RequestHeader set X-Forwarded-Proto "https"
